name: hervoice
description: HERVOICE student reporting interface — explicit fictional UI preview.
publish_to: none
version: 0.2.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  go_router: ^18.0.2
  file_selector: ^1.1.0
  cupertino_icons: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  file_selector_platform_interface: ^2.7.0

flutter:
  uses-material-design: true
  fonts:
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
