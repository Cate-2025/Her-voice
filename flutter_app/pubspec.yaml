name: hervoice
description: HERVOICE student reporting interface — explicit fictional UI preview.
publish_to: none
version: 0.2.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  go_router: ^18.0.2
  file_selector: ^1.1.0
  cupertino_icons: ^1.0.9
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  flutter_secure_storage: ^11.2.0
  cryptography: ^2.9.0
  path_provider: ^2.1.6
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  file_selector_platform_interface: ^2.7.0

flutter:
  uses-material-design: true
  fonts:
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
